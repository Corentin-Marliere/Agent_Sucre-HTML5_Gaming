<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Left lens -->
  <rect x="64" y="88" width="25" height="18" rx="4" fill="#0284c7" fill-opacity="0.35" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Right lens -->
  <rect x="111" y="88" width="25" height="18" rx="4" fill="#0284c7" fill-opacity="0.35" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Bridge -->
  <path d="M 89 95 Q 100 92 111 95" stroke="#0f172a" stroke-width="2.5" fill="none"/>
  <!-- Left temple bar -->
  <line x1="64" y1="94" x2="50" y2="98" stroke="#0f172a" stroke-width="2"/>
  <!-- Right temple bar -->
  <line x1="136" y1="94" x2="150" y2="98" stroke="#0f172a" stroke-width="2"/>
  <!-- Lens reflection flare -->
  <line x1="68" y1="91" x2="76" y2="103" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="115" y1="91" x2="123" y2="103" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
</svg>