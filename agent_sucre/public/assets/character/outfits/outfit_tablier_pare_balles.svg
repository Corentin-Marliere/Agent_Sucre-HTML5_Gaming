<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Tactical Dark Pants with Knee Pads -->
  <path d="M 74 205 L 72 272 Q 72 278 85 278 Q 96 278 96 272 L 95 205 Z" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 105 205 L 104 272 Q 104 278 115 278 Q 128 278 128 272 L 126 205 Z" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Reinforced Kevlar Knee Pads -->
  <rect x="75" y="235" width="18" height="16" rx="4" fill="#1e293b" stroke="#00ffcc" stroke-width="1"/>
  <rect x="107" y="235" width="18" height="16" rx="4" fill="#1e293b" stroke="#00ffcc" stroke-width="1"/>
  <!-- Under Armor Shirt -->
  <path d="M 65 158 Q 100 165 135 158 L 138 210 L 62 210 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.8"/>
  <!-- Sleeves -->
  <path d="M 65 158 Q 50 185 52 205 L 68 202 L 73 165 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.8"/>
  <path d="M 135 158 Q 150 185 148 205 L 132 202 L 127 165 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.8"/>
  <!-- Arm Guard / Holster -->
  <rect x="48" y="182" width="16" height="14" rx="2" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
  <!-- Heavy Armored Kevlar Apron -->
  <path d="M 74 165 L 126 165 L 128 250 Q 100 255 72 250 Z" fill="#111827" stroke="#374151" stroke-width="2"/>
  <!-- Armor Segment Plates -->
  <polygon points="78,172 122,172 120,195 80,195" fill="#1f2937" stroke="#4b5563" stroke-width="1.2"/>
  <polygon points="76,199 124,199 122,224 78,224" fill="#1f2937" stroke="#4b5563" stroke-width="1.2"/>
  <!-- Tactical Molle Straps -->
  <line x1="82" y1="183" x2="118" y2="183" stroke="#374151" stroke-width="3" stroke-dasharray="4,3"/>
  <line x1="80" y1="211" x2="120" y2="211" stroke="#374151" stroke-width="3" stroke-dasharray="4,3"/>
  <!-- Golden Tactical Buckle (Chef Ramsay insignia) -->
  <ellipse cx="100" cy="168" rx="7" ry="4" fill="#eab308" stroke="#a16207" stroke-width="1.5"/>
  <!-- Neon Cyan Accent Piping -->
  <line x1="74" y1="165" x2="72" y2="250" stroke="#00ffcc" stroke-width="2"/>
  <line x1="126" y1="165" x2="128" y2="250" stroke="#00ffcc" stroke-width="2"/>
  <!-- Tactical Badge -->
  <rect x="88" y="186" width="24" height="12" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <text x="100" y="195" font-size="6" font-family="monospace" font-weight="bold" fill="#ffffff" text-anchor="middle">LYFE-007</text>
</svg>